name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

# 强制编译模式：任何一步失败都立刻让整个 workflow 失败，不使用 continue-on-error，
# 目的是一次性把所有真实的构建问题暴露出来，而不是被吞掉。
jobs:
  build:
    name: Assemble debug + release, run lint
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # ubuntu-latest runner 自带 Android SDK，许可也已预接受。
      # 这里不用 android-actions/setup-android：它的 v3 会去安装早已下架的
      # legacy `tools` 包，在新版 cmdline-tools 上必然报
      # "Warning: Failed to find package 'tools'" 而整体失败。
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate SDK and accept licenses
        run: |
          set -o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          echo "### preinstalled"
          "$SDKMANAGER" --list_installed 2>/dev/null | grep -E "platforms;|build-tools;" || true

      - name: Install compileSdk 37
        run: |
          set -o pipefail
          # 注意：新版 Android SDK 带小版本号，包名是 platforms;android-37.0，
          # 不存在名为 platforms;android-37 的包。compileSdk 37 对应 37.0。
          # build-tools 未在 build.gradle 中固定版本，AGP 仍可能按需自动下载其它版本。
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Show SDK diagnostics
        run: |
          echo "### installed after step"
          sdkmanager --list_installed 2>/dev/null | grep -E "platforms;|build-tools;" || true
          echo "### available android-37 platforms"
          sdkmanager --list 2>/dev/null | grep -oE "platforms;android-37[0-9.]*" | sort -u || true

      - name: Ensure signing keystore
        # build.gradle 里 signingConfigs.release 指向仓库根目录的 keystore.jks，
        # 而 debug 也复用了这个签名配置。
        # 仓库里已经带了一份固定的自签名密钥（口令与 build.gradle 中的硬编码值一致），
        # 所有构建共用它，签名才会稳定，APK 才能覆盖安装而不必卸载。
        # 只有当仓库里没有这份文件时才现场生成一份——那样生成出来的密钥每次都不同，
        # 会导致 INSTALL_FAILED_UPDATE_INCOMPATIBLE。
        run: |
          set -o pipefail
          if [ -f keystore.jks ]; then
            echo "Using the keystore committed to the repository (stable signature)."
          else
            echo "::warning::No keystore.jks in the repo, generating a throwaway one. Signature will differ from previous builds."
            # 必须用 JKS：PKCS12 不支持 store 密码与 key 密码不同，而这里两者确实不同。
            keytool -genkeypair -v \
              -keystore keystore.jks \
              -storetype JKS \
              -storepass ImapNotes2 \
              -keypass ImapNotes \
              -alias ImapNotes \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ImapNotes3, OU=ImapNotes3, O=ImapNotes3, C=DE"
          fi
          keytool -list -v -keystore keystore.jks -storepass ImapNotes2 \
            | grep -E "Alias name|Entry type|Keystore type|SHA256"

      - name: Show Gradle version
        run: ./gradlew --version --no-daemon

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace --warning-mode all

      - name: Assemble release
        run: ./gradlew assembleRelease --stacktrace --warning-mode all

      - name: List APKs
        run: |
          set -o pipefail
          echo "### APKs"
          find . -name '*.apk' -not -path './.gradle/*' -exec ls -la {} \;
          COUNT=$(find . -name '*.apk' -not -path './.gradle/*' | wc -l)
          echo "### APK count: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No APK was produced."
            exit 1
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ImapNotes3-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error

      - name: Run lint
        # 照常运行并输出全部结果，但不让它阻断构建。上游有 182 个预存在的
        # lint 错误，绝大多数是 values-<lang>/strings.xml 的 MissingTranslation
        # （hi/bn/ta/ja/pl 翻译不全），与本次改动无关，也不影响 APK 可用性。
        continue-on-error: true
        run: ./gradlew lintDebug --stacktrace

      - name: Summarise lint results
        if: always()
        run: |
          set -o pipefail
          REPORT=ImapNotes3/build/reports/lint-results-debug.txt
          if [ -f "$REPORT" ]; then
            echo "### lint error/warning counts by issue id"
            grep -oE "\[[A-Za-z]+\]$" "$REPORT" | sort | uniq -c | sort -rn || true
            echo "### total"
            tail -3 "$REPORT" || true
          else
            echo "no lint text report found at $REPORT"
          fi
